[project]
name = "climate-rag"
version = "0.1.0"
description = "A Production-Ready Multi-Agent RAG System for Climate Policy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "toolz>=0.12.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "structlog>=24.1.0",
    "maturin>=1.5.0",
    "python-dotenv>=1.0.0",
    "openai>=1.14.0",
    "httpx>=0.27.0",
    "lxml>=5.1.0",           # For advanced parsing if needed in logic
    "numpy>=1.26.0",
]

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "climate_core"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
ignore_missing_imports = true
