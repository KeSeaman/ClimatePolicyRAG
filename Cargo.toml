[package]
name = "climate_core"
version = "0.3.0"
edition = "2021"

[lib]
name = "climate_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# extension-module is enabled by maturin (see pyproject.toml) so `cargo test` can link libpython.
pyo3 = { version = "0.30", features = ["abi3-py312"] }
rayon = "1.10" # Parallel similarity scoring
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0" # documents.jsonl in saved indexes
numpy = "0.30" # Read float32 arrays in place (rust-numpy, must match the pyo3 version)

[profile.release]
lto = "fat"
codegen-units = 1
